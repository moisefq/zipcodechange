<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Price Checker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container price-checker">
        <h1>Check Your Price</h1>
        <div class="input-group">
            <label for="zipCode">Enter Zip Code:</label>
            <input type="text" id="zipCode" placeholder="e.g., 12345">
        </div>
        <button id="checkButton">Check Price</button>
        <p class="result-display">Your price: <span id="displayPrice">$10.00</span></p>
        <p class="message" id="statusMessage"></p>
    </div>

    <div class="container admin-dashboard">
        <h2>Admin Dashboard</h2>
        <div class="input-group">
            <label for="adminZipCode">Zip Code:</label>
            <input type="text" id="adminZipCode" placeholder="e.g., 12345">
        </div>
        <div class="input-group">
            <label for="adminPrice">New Price:</label>
            <input type="number" id="adminPrice" step="0.01" placeholder="e.g., 15.50">
        </div>
        <button id="updatePriceButton">Update Price</button>
        <button id="setDefaultPriceButton">Set Default Price</button>
        <div class="input-group default-price-input">
            <label for="newDefaultPrice">New Default Price:</label>
            <input type="number" id="newDefaultPrice" step="0.01" placeholder="e.g., 10.00">
        </div>
        <p class="message" id="adminStatusMessage"></p>

        <h3>Current Prices</h3>
        <ul id="priceList">
            <!-- Prices will be loaded here by JavaScript -->
        </ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
